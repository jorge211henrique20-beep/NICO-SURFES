<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nico Runner 3D</title>
<style>
:root{--card:rgba(36,27,72,.92);--ink:#f7f3ff;--accent:#ff6a3d;--accent2:#ffb703;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#ffb27a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}

/* ---------- HUD em Jogo ---------- */
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:12px 14px;pointer-events:none;contain:layout style;z-index:5}
.hud-grp{display:flex;align-items:center;gap:8px}
.h-pill{background:rgba(35,26,68,.76);color:#fff;font-weight:900;font-size:19px;padding:7px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);box-shadow:0 4px 12px rgba(0,0,0,.22);display:inline-flex;align-items:center;gap:6px;transition:transform .14s}
.h-pill.pop{transform:scale(1.16)}
.h-pill.rec{border-color:#ffd23f;color:#ffe66d}
#recTag{font-size:11px;background:linear-gradient(135deg,#ffb703,#ff6a3d);color:#fff;padding:2px 7px;border-radius:99px;display:none;letter-spacing:.4px}
#pauseBtn{pointer-events:auto;width:42px;height:42px;padding:0;font-size:17px;background:rgba(35,26,68,.78);border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}

/* ---------- Botão Prancha com Anel de Tempo ---------- */
#bd{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:76px;height:76px;padding:0;border-radius:50%;font-size:28px;background:linear-gradient(135deg,#4de3ff,#7a5cff);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;z-index:5;box-shadow:0 6px 0 rgba(25,18,56,.4),0 10px 22px rgba(0,0,0,.32)}
#bd small{font-size:13px;font-weight:900;margin-top:2px}
#bd svg{position:absolute;inset:-4px;width:84px;height:84px;transform:rotate(-90deg);pointer-events:none}
#bdRing{fill:none;stroke:#ffd23f;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:245;stroke-dashoffset:245}

#diz{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);display:none;background:rgba(214,40,57,.9);color:#fff;font-weight:800;font-size:14px;padding:6px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);pointer-events:none;white-space:nowrap;z-index:5}

/* ---------- Menu Principal (Lobby) ---------- */
#ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;background:linear-gradient(180deg,rgba(35,24,68,.76),rgba(35,24,68,0) 30%,rgba(35,24,68,0) 52%,rgba(28,19,58,.9));pointer-events:none;z-index:10}
.top-bar{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.bank{background:rgba(35,26,68,.68);border:1.5px solid rgba(255,210,63,.45);color:#ffe680;font-weight:900;font-size:14px;padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.ward-btn{background:linear-gradient(135deg,#9b5de5,#f15bb5);font-size:14px;padding:7px 15px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.28)}
.hd{text-align:center;margin-top:-4px;pointer-events:auto}
#t{margin:0;font-size:clamp(32px,9vw,62px);font-weight:900;color:#fff;transform:rotate(-2.5deg);text-shadow:0 3px 0 #ff6a3d,0 6px 0 #c9441f,0 12px 24px rgba(0,0,0,.45);letter-spacing:1px}
.sub-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
#m{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(35,26,68,.62);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:14px}
#againBtn{display:none;padding:7px 18px;font-size:14px;background:linear-gradient(135deg,#2fbf8f,#1b9aaa);box-shadow:0 3px 0 rgba(0,0,0,.28)}

.pn{width:100%;max-width:720px;pointer-events:auto}
.sel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.pill{display:flex;align-items:center;gap:5px;background:rgba(34,25,66,.72);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 6px;color:#fff;font-weight:800;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.pill-lbl{min-width:148px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 4px}
.pill-lbl:hover{opacity:.9}
.sw-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0;display:inline-block}
.tx-tag{font-size:10px;background:rgba(255,210,63,.25);color:#ffe680;padding:1px 5px;border-radius:99px;font-weight:900}
.ar{padding:0;width:32px;height:32px;font-size:20px;line-height:1;box-shadow:none;background:rgba(255,255,255,.2)}
.ar:hover{background:rgba(255,255,255,.32)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:8px}.mode{flex-direction:row!important;align-items:center!important;justify-content:space-between;padding:10px 14px!important}.mode-txt{display:flex;flex-direction:column;gap:1px}.mode .ic{font-size:28px!important}}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 16px;border-radius:20px;text-align:left;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border:1.5px solid rgba(255,255,255,.25);box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.28);transition:transform .15s,filter .15s}
.mode:hover{transform:translateY(-3px) scale(1.015)}
.mode:active{transform:translateY(2px)}
.mode .ic{font-size:28px;line-height:1}
.mode .nm{font-size:19px;font-weight:900;display:block}
.mode small{font-size:12.5px;font-weight:600;opacity:.92;display:block}
.mode em{font-style:normal;font-size:11.5px;font-weight:800;background:rgba(0,0,0,.28);padding:3px 10px;border-radius:99px;margin-top:3px;white-space:nowrap}
.keys{text-align:center;color:#fff;opacity:.85;font-size:12.5px;margin-top:9px;font-weight:600}

/* ---------- Gaveta Vestiário (Skins & Pranchas) ---------- */
#ward{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);width:calc(100% - 24px);max-width:680px;background:rgba(30,22,60,.94);color:#fff;border:1.5px solid rgba(255,255,255,.22);border-radius:24px;padding:14px 16px;box-sizing:border-box;box-shadow:0 16px 40px rgba(0,0,0,.55);display:none;z-index:20;pointer-events:auto}
.w-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.w-tabs{display:flex;gap:6px}
.w-tab{padding:6px 14px;font-size:14px;background:rgba(255,255,255,.12);box-shadow:none}
.w-tab.on{background:linear-gradient(135deg,#ff8a1f,#ff4d6d)}
.w-close{width:34px;height:34px;padding:0;font-size:16px;background:rgba(255,255,255,.16);box-shadow:none}
.w-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;max-height:38vh;overflow-y:auto;padding:2px}
.w-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid transparent;color:#fff;font-size:13px;font-weight:800;text-align:left;box-shadow:none}
.w-item:hover{background:rgba(255,255,255,.15)}
.w-item.on{border-color:#ffd23f;background:rgba(255,210,63,.16)}
.w-sw{width:28px;height:28px;border-radius:9px;border:1.5px solid rgba(255,255,255,.5);flex-shrink:0;background-size:cover;background-position:center}
.w-meta{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.w-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-meta small{font-size:10px;color:#ffd23f;font-weight:800}

/* ---------- Modal de Pausa ---------- */
#pauseOv{position:fixed;inset:0;background:rgba(20,14,44,.65);display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
.p-card{background:var(--card);color:var(--ink);border:1.5px solid rgba(255,255,255,.2);border-radius:26px;padding:24px 26px;text-align:center;width:100%;max-width:290px;box-shadow:0 16px 38px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.p-card h2{margin:0 0 4px;font-size:26px;font-weight:900}
.p-card button{width:100%;font-size:16px;padding:12px}
.btn-sec{background:rgba(255,255,255,.15);box-shadow:0 3px 0 rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="hud" style="visibility:hidden">
  <div class="hud-grp">
    <span class="h-pill" id="scPill"><span id="sc">0 m</span><span id="recTag">RECORDE!</span></span>
  </div>
  <div class="hud-grp">
    <span class="h-pill" id="co">🪙 0</span>
    <button id="pauseBtn" title="Pausar (P)">⏸</button>
  </div>
</div>

<div id="diz"></div>
<button id="bd" style="visibility:hidden" title="Ativar Prancha (Espaço duplo / B / Shift)">
  <svg viewBox="0 0 84 84"><circle id="bdRing" cx="42" cy="42" r="39"/></svg>
  🛹<small id="bn">1</small>
</button>

<div id="ov">
  <div class="top-bar">
    <span class="bank" id="bank">🪙 0</span>
    <button class="ward-btn" id="openWard">🎨 Vestiário (28)</button>
  </div>
  <div class="hd">
    <h1 id="t">NICO RUNNER</h1>
    <div class="sub-row">
      <span id="m">Escolha um modo e corra! 🌇</span>
      <button id="againBtn">↻ Jogar de Novo</button>
    </div>
  </div>
  <div class="pn">
    <div class="sel">
      <div class="pill">
        <button class="ar" data-k="skin" data-d="-1">‹</button>
        <div class="pill-lbl" data-open="skin"><i class="sw-dot" id="skDot"></i><span id="sk"></span></div>
        <button class="ar" data-k="skin" data-d="1">›</button>
      </div>
      <div class="pill">
        <button class="ar" data-k="board" data-d="-1">‹</button>
        <div class="pill-lbl" data-open="board"><i class="sw-dot" id="bkDot"></i><span id="bk"></span></div>
        <button class="ar" data-k="board" data-d="1">›</button>
      </div>
    </div>
    <div class="grid">
      <button class="mode" data-m="normal" style="--c1:#ffb703;--c2:#ff6a3d"><span class="ic">🏃</span><span class="mode-txt"><span class="nm">Normal</span><small>Corra, desvie e pegue moedas</small></span><em id="b-normal"></em></button>
      <button class="mode" data-m="nocoin" style="--c1:#ff4d6d;--c2:#9b1d4a"><span class="ic">☠️</span><span class="mode-txt"><span class="nm">Sem Moedas</span><small>Pegou uma moeda? Morreu!</small></span><em id="b-nocoin"></em></button>
      <button class="mode" data-m="lava" style="--c1:#ff8a1f;--c2:#c2260f"><span class="ic">🌋</span><span class="mode-txt"><span class="nm">Chão é Lava</span><small>Corra só em cima dos trens</small></span><em id="b-lava"></em></button>
    </div>
    <div class="keys">← → pista · ↑ pular · ↓ deslizar · B/Shift prancha · P pausar · no celular, deslize</div>
  </div>
</div>

<div id="ward">
  <div class="w-hd">
    <div class="w-tabs">
      <button class="w-tab on" data-wt="skin">👕 Skins (16)</button>
      <button class="w-tab" data-wt="board">🛹 Pranchas (12)</button>
    </div>
    <button class="w-close" id="closeWard">✕</button>
  </div>
  <div class="w-grid" id="wardGrid"></div>
</div>

<div id="pauseOv">
  <div class="p-card">
    <h2>⏸ Jogo Pausado</h2>
    <button id="resBtn">▶ Continuar</button>
    <button id="rstBtn" class="btn-sec">↻ Reiniciar</button>
    <button id="menuBtn" class="btn-sec">🏠 Menu Principal</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

addEventListener('touchend',e=>{
  if(state!=='play')return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){
    const now=performance.now();if(now-lastTap<300)act('B');lastTap=now;return;
  }
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'R':'L');else act(dy<0?'U':'D')},{passive:true});

/* ---------- Loop Principal c/ Animações Avançadas ---------- */
let last=performance.now(),fpsAcc=0,fpsN=0;
function loop(now){requestAnimationFrame(loop);
  if(state==='pause')return;
  const raw=(now-last)/1000,dt=Math.min(raw,.05);last=now;t+=dt;
  if(raw<.25){fpsAcc+=raw;if(++fpsN>=90){const avg=fpsN/fpsAcc;fpsAcc=fpsN=0;
    if(avg<48&&dprCap>1){dprCap=Math.max(1,dprCap-.25);ren.setPixelRatio(dprCap);ren.setSize(innerWidth,innerHeight)}}}
  for(let i=0;i<clouds.length;i++){const c=clouds[i];c.position.x+=dt*1.5;if(c.position.x>140)c.position.x=-140}
  if(mode==='lava')lavaTex.offset.y+=dt*.2;

  if(state==='play'){
    speed=Math.min(40,speed+dt*(dizzy>0?1.2:.35));const d=speed*dt;dist+=d;
    for(let i=0;i<NSEG;i++){const s=segs[i];s.position.z+=d;if(s.position.z>SEG*1.5)s.position.z-=SEG*NSEG}
    for(let i=0;i<obs.length;i++)obs[i].m.position.z+=d;
    const cr=dt*5;for(let i=0;i<coins.length;i++){const m=coins[i].m;m.position.z+=d;m.rotation.y+=cr}
    if(mode==='lava'){nz[0]+=d;nz[1]+=d;nz[2]+=d;lavaSpawn()}else{nextZ+=d;while(nextZ>-170)spawnRow()}
    dizzy=Math.max(0,dizzy-dt);invul=Math.max(0,invul-dt);if(boardT>0)boardT=Math.max(0,boardT-dt);
    gY=0;
    if(mode==='lava')for(let i=0;i<obs.length;i++){const o=obs[i];if(o.lane!==lane||Math.abs(o.m.position.z)>4.35)continue;if(y>=TOP-.6)gY=TOP;else return die('crash')}
    vy-=38*dt;y+=vy*dt;if(y<=gY){y=gY;if(vy<0)vy=0}
    const grd=y<=gY+.01;
    if(wasAir&&grd)squash=-.24; // squash elástico ao pousar!
    wasAir=!grd;
    if(slide>0&&grd)slide-=dt;
    hero.position.x+=(LANES[lane]-hero.position.x)*Math.min(1,dt*15);
    const sliding=slide>0&&grd;
    if(mode==='lava'){lavaT=(gY===0&&grd&&boardT<=0)?lavaT+dt:0;if(lavaT>.12)return die('lava')}
    else for(let i=0;i<obs.length;i++){const o=obs[i],z=o.m.position.z;
      if(o.lane!==lane||Math.abs(z)>o.depth/2+.35||Math.abs(hero.position.x-LANES[o.lane])>1)continue;
      if(o.hit)continue;
      if((o.type==='train'&&y<3.3)||(o.type==='low'&&y<.9)||(o.type==='high'&&!sliding&&y<1.6)){if(hit(o))return}}
    for(let i=coins.length-1;i>=0;i--){const c=coins[i],z=c.m.position.z;
      if(z>8){freeCoin(c);coins[i]=coins[coins.length-1];coins.pop();continue}
      if(c.lane===lane&&Math.abs(z)<.8&&Math.abs(c.m.position.y-y-1)<1.3){
        freeCoin(c);coins[i]=coins[coins.length-1];coins.pop();
        if(mode==='nocoin')die('coin');else{coinCount++;elCo.classList.add('pop');setTimeout(()=>elCo.classList.remove('pop'),110);if(coinCount%25===0&&boards<3)boards++}}}
    for(let i=obs.length-1;i>=0;i--){const o=obs[i];
      if(o.m.position.z>12){freeObs(o);obs[i]=obs[obs.length-1];obs.pop()}}

    // Atualização inteligente do HUD (só toca no DOM quando muda)
    const dInt=dist|0;
    if(dInt!==pSc){pSc=dInt;elSc.textContent=dInt+' m';
      const isR=best[mode]>0&&dInt>best[mode];if(isR!==pRec){pRec=isR;elRec.style.display=isR?'inline-block':'none';elScPill.classList.toggle('rec',isR)}}
    if(mode!=='nocoin'&&coinCount!==pCo){pCo=coinCount;elCo.textContent='🪙 '+coinCount}
    const bnTxt=boardT>0?Math.ceil(boardT)+'s':''+boards;if(bnTxt!==pBn){pBn=bnTxt;elBn.textContent=bnTxt}
    if(boardT>0)elRing.style.strokeDashoffset=''+(245*(1-boardT/15)).toFixed(1);else if(pBdOp!==2)elRing.style.strokeDashoffset='245';
    const bdOp=boardT>0?2:(boards>0?1:.45);if(bdOp!==pBdOp){pBdOp=bdOp;elBd.style.opacity=bdOp===.45?.45:1}
  }

  /* ---------- Sistema de Animação Expressiva do Nico ---------- */
  const lobby=state==='menu',over=state==='over',bon=lobby||boardT>0;
  if(lobby)for(let i=0;i<NSEG;i++){const g=segs[i];g.position.z+=dt*5;if(g.position.z>SEG*1.5)g.position.z-=SEG*NSEG}

  // Amortecimento de molas secundárias (squash/stretch, slide, surf, dodge, pirueta, reação)
  squash+=(0-squash)*Math.min(1,dt*13);
  dodgeTilt+=(0-dodgeTilt)*Math.min(1,dt*10);
  if(flipT>0)flipT=Math.max(0,flipT-dt*2.4);
  if(cheerT>0)cheerT=Math.max(0,cheerT-dt);
  if(hitT>0)hitT=Math.max(0,hitT-dt);
  if(over)overT=Math.min(1,overT+dt*3);

  const air=y>gY+.05,sl=state==='play'&&slide>0&&!air;
  slideP+=((sl?1:0)-slideP)*Math.min(1,dt*16);
  surfP+=((bon?1:0)-surfP)*Math.min(1,dt*12);

  // Piscada natural dos olhos
  blinkT-=dt;if(blinkT<-.12)blinkT=2.2+Math.random()*2.6;
  const eyeY=dizzy>0?.35:(blinkT<0?.08:1);
  hero.eyes[0].scale.y=hero.eyes[1].scale.y=eyeY;

  const run=state==='play'?t*(10.5+speed*.14):lobby?t*3.2:0;
  const sw=Math.sin(run),cw=Math.cos(run);
  const dx=LANES[lane]-hero.position.x;

  // Posição vertical com passada elástica, flutuação da prancha e pulinho de alegria no menu
  const cheerHop=cheerT>0?Math.sin((cheerT/.65)*Math.PI)*.32:0;
  const bob=lobby?(.16+Math.sin(t*2.4)*.06+cheerHop):(bon&&!air?(.06+Math.sin(t*7)*.04):(!air&&state==='play'?Math.abs(sw)*.11:0));
  hero.position.y=y+bob;

  // Squash & Stretch sem achatar a cabeça durante o slide
  const sy=1+squash,sxz=1-squash*.55;
  hero.scale.set(sxz,sy,sxz);

  // Inclinação global do personagem (lean p/ frente na corrida, cambalhota no pulo, inclinação na curva)
  const targetRx=over?.85:sl?.58:air?Math.max(-.25,Math.min(.28,-vy*.018)):lobby?0:-(.12+speed*.0025)*(1-surfP*.65);
  hero.rotation.x+=(targetRx-hero.rotation.x)*Math.min(1,dt*14)+(hitT>0?Math.sin(hitT*28)*.08:0);
  hero.rotation.z=-dx*.09+dodgeTilt+(dizzy>0?Math.sin(t*7)*.11:0);
  if(lobby)hero.rotation.y+=dt*(1.25+(cheerT>0?5.5:0));else hero.rotation.y=0;

  // Postura do tronco (torção de corrida, postura lateral de surfista na prancha e parkour slide!)
  const flipSpin=(flipT>0&&!bon&&air)?(1-flipT)*Math.PI*2:0;
  hero.g.position.y=(bon?.16:0)-slideP*.52-(over?overT*.35:0);
  hero.g.rotation.x=flipSpin+(slideP*.45);
  hero.g.rotation.y=Math.PI+surfP*.58+slideP*.35+(1-surfP)*(1-slideP)*(air?0:sw*.15);
  hero.g.rotation.z=surfP*dx*.05;

  // Membros expressivos (corrida, surf, pulo dinâmico, deslize estiloso e comemoração no menu)
  if(over){
    hero.legL.rotation.x=-.7;hero.legR.rotation.x=.5;
    hero.armL.rotation.x=-1.8;hero.armR.rotation.x=-1.5;
    hero.armL.rotation.z=-.5;hero.armR.rotation.z=.5;
  }else if(slideP>.25){
    // Slide parkour: uma perna esticada à frente, outra dobrada, braços equilibrando!
    hero.legL.rotation.x=-1.15*slideP;hero.legR.rotation.x=.55*slideP;
    hero.armL.rotation.x=-.9*slideP;hero.armR.rotation.x=.7*slideP;
    hero.armL.rotation.z=-.45*slideP;hero.armR.rotation.z=.35*slideP;
  }else if(air){
    const vyN=Math.max(-1,Math.min(1,vy/14));
    hero.legL.rotation.x=-.65+vyN*.25;hero.legR.rotation.x=.5-vyN*.2;
    hero.armL.rotation.x=-2.1-vyN*.45;hero.armR.rotation.x=-1.9-vyN*.45;
    hero.armL.rotation.z=-.42;hero.armR.rotation.z=.42;
  }else if(bon){
    // Postura de surfista/skatista com joelhos flexionados e braços abertos p/ equilíbrio
    const crouch=lobby?Math.sin(t*2.4)*.08:Math.sin(t*9)*.1;
    hero.legL.rotation.x=-.28+crouch;hero.legR.rotation.x=.28-crouch;
    hero.armL.rotation.x=cheerT>0?-2.5:(-.35+Math.sin(t*4)*.12);
    hero.armR.rotation.x=.25-Math.sin(t*4)*.12;
    hero.armL.rotation.z=cheerT>0?-.35:-.52;hero.armR.rotation.z=.48;
  }else{
    // Corrida atlética com abertura natural dos cotovelos e passada viva
    const amp=.95+speed*.008;
    hero.legL.rotation.x=sw*amp+Math.max(0,cw)*.18;
    hero.legR.rotation.x=-sw*amp+Math.max(0,-cw)*.18;
    hero.armL.rotation.x=-sw*amp*.92-.12;
    hero.armR.rotation.x=sw*amp*.92-.12;
    hero.armL.rotation.z=-.15-Math.abs(cw)*.08;
    hero.armR.rotation.z=.15+Math.abs(cw)*.08;
  }

  // Cabeça olha p/ a direção da curva, compensa a rotação da prancha e balança no ritmo
  hero.head.rotation.y=-surfP*.52+dx*.14+(lobby?Math.sin(t*1.5)*.18:0);
  hero.head.rotation.x=air?-.14:(lobby?Math.sin(t*2.4)*.05:Math.abs(cw)*.06);
  hero.head.rotation.z=dizzy>0?Math.sin(t*9)*.3:(-dx*.06+Math.sin(run*.5)*.05);

  const stVis=dizzy>0&&state==='play';stars.visible=stVis;if(stVis)stars.rotation.y+=dt*7;
  if(stVis!==pDizVis){pDizVis=stVis;elDiz.style.display=stVis?'block':'none'}
  if(stVis){const dt2=dizzy.toFixed(1);if(dt2!==pDizTxt){pDizTxt=dt2;elDiz.textContent='😵 Tonto! '+dt2+'s — outra batida e acabou'}}
  hero.visible=state!=='play'||invul<=0||Math.floor(t*14)%2===0;

  // Cachecol reage à velocidade, vento e queda vertical!
  const wind=state==='play'?(9+speed*.22):6,lift=air?Math.max(-.35,Math.min(.45,-vy*.025)):0;
  for(let i=0;i<4;i++){const s=hero.scarf[i];s.rotation.y=Math.sin(t*wind-i*.85)*(.24+speed*.004)-dx*.08;s.rotation.x=-.22+lift+Math.sin(t*(wind*1.2)-i)*.16}

  // Prancha c/ kickflip 360° nos pulos e carving nas curvas!
  hero.board.visible=bon;
  if(bon){
    hero.board.userData.glow.scale.set(1,1,1+Math.sin(t*12)*.08);
    hero.board.rotation.z=(flipT>0?(1-flipT)*Math.PI*2:0)-dx*.12;
    hero.board.rotation.x=air?Math.max(-.3,Math.min(.3,-vy*.02)):Math.sin(t*6)*.03;
  }

  pad.visible=lobby;blob.visible=!lobby;
  if(lobby){pad.rotation.y+=dt*.5;for(let i=0;i<14;i++){const a=t*1.2+i*Math.PI*2/14;sp[i].position.set(Math.cos(a)*1.9,.4+Math.sin(t*2+i)*.5+(i%3)*.3,Math.sin(a)*1.9)}}
  else{blob.position.x=hero.position.x;blob.position.y=gY+.03;blob.scale.setScalar(Math.max(.35,1-(y-gY)*.2))}

  camY+=(gY-camY)*.08;const kk=lobby?.06:.15;
  cam.position.x+=((lobby?0:hero.position.x*.6)-cam.position.x)*kk;
  cam.position.y+=((lobby?2.05:4+camY+(y-gY)*.25)-cam.position.y)*kk;
  cam.position.z+=((lobby?5.1:7.5)-cam.position.z)*kk;
  if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake*.6;shake=Math.max(0,shake-dt)}
  lookP.set(cam.position.x*.5,1.7+camY,-9);look.lerp(lobby?lookL:lookP,lobby?.08:.2);cam.lookAt(look);
  ren.render(scene,cam)}
requestAnimationFrame(loop);
</script>
</body>
</html>
